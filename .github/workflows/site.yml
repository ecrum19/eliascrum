name: Validate and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate and build from committed content snapshots
        run: npm run build:ci

      # The inventory is rebuilt from the committed talk archives and records; a diff means a commit
      # changed talk PDFs or their records without running `npm run build:slides`.
      - name: Check the talk asset inventory is current
        run: |
          npm run build:slides -- --inventory-only
          git diff --exit-code -- src/content/generated/talkAssets.ts

      # Exports only change when their content does, so any diff means a commit forgot to regenerate them.
      - name: Check committed exports are current
        run: git diff --exit-code -- src/data/rdf/site-data.ttl public/site-data.ttl public/recent_work.json public/recent_work.ttl

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          # Empty for eliascrum.info; /eliascrum before the domain is configured.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: npm run build:site -- --base "${BASE_PATH}/"

      - name: Add SPA fallback and nojekyll marker
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keep the .nojekyll marker; v4+ leaves dotfiles out by default.
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages occasionally stalls while syncing files; the 10-minute default cancelled
          # the deploy after the #32 merge although the build itself was fine.
          timeout: 1800000

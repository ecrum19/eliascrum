name: Update Alphabet Stock Snapshot

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alphabet-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update Alphabet stock snapshot
        run: npm run update:alphabet-stock

      - name: Commit and push changes
        run: |
          if git diff --quiet -- public/alphabet-stock.json; then
            echo "No new market close detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/alphabet-stock.json
          git commit -m "chore: update Alphabet stock snapshot"
          git push
